name: Testing Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Lgin to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-south-1.amazonaws.com
      
      - name: Build docker image
        run: docker build -t devops-platform:latest .
      
      - name: Image Tag
        run: docker tag devops-platform:latest ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-south-1.amazonaws.com/demo-repo:build-${{ github.run_number }}

      - name: Push the Image
        run: docker push ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-south-1.amazonaws.com/demo-repo:build-${{ github.run_number }}
      
      - name: Execute remote SSH commands using SSH key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            BUILD_NUM="${{ github.run_number }}"
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-south-1.amazonaws.com
            sudo docker stop myapp || true
            sudo docker rm myapp || true
            sudo docker rmi -f $(sudo docker images -q)
            sudo docker pull ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-south-1.amazonaws.com/demo-repo:build-$BUILD_NUM
            sudo docker run -d --name myapp -p 80:80 ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-south-1.amazonaws.com/demo-repo:build-$BUILD_NUM
            
