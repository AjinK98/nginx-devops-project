name: Testing Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Lgin to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-south-1.amazonaws.com
      
      - name: Build docker image
        run: docker build -t devops-platform:${GITHUB_SHA::7}
      
      - name: Image Tag
        run: docker tag devops-platform:${GITHUB_SHA::7} ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-south-1.amazonaws.com/demo-repo:v1

      - name: Push the Image
        run: docker push ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-south-1.amazonaws.com/demo-repo:v1
